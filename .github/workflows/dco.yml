name: DCO

# Verifies every non-merge commit in a PR carries a `Signed-off-by:` line
# (Developer Certificate of Origin — see /DCO). Self-contained: no external app.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the PR commit range resolves

      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+\..+>'; then
              subject=$(git log -1 --format='%s' "$sha")
              echo "::error::Commit ${sha:0:8} (\"$subject\") is missing a Signed-off-by line."
              fail=1
            fi
          done < <(git rev-list --no-merges "$base".."$head")
          if [ "$fail" = "1" ]; then
            echo ""
            echo "Sign your commits to certify the DCO (/DCO):"
            echo "  new commit:        git commit -s"
            echo "  fix the whole PR:  git rebase --signoff $base && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off. ✓"
